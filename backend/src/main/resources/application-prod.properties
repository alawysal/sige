spring.application.name=gestaoescolar
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:escola_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
sige.demo-seed=${DEMO_SEED:false}

sige.admin-password=${ADMIN_PASSWORD:}
sige.initial-school-year=${INITIAL_SCHOOL_YEAR:}
sige.school-name=${SCHOOL_NAME:Escola por configurar}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.main.banner-mode=off
logging.level.root=INFO
