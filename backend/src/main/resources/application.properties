spring.application.name=sige-nacional
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:escola_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:escola}
spring.datasource.password=${DB_PASSWORD:escola123}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=sige_schema_history
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
sige.demo-seed=${DEMO_SEED:true}
jwt.secret=${JWT_SECRET:QjY4c3Q4M1pOc2VnVWo2U0RvS1JmYk9nT0RqcGJZb1Q2U3V2N0M0Q==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
