# Standalone production stack; never combine with docker-compose.yml.
name: ${COMPOSE_PROJECT_NAME:-sige-production}
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Execute scripts/prepare-production.sh}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME em falta}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD em falta}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD em falta}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  backend:
    image: sige-backend:${RELEASE_TAG:-initial}
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME em falta}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME em falta}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD em falta}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET em falta}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      DEMO_SEED: 'false'
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD em falta}
      INITIAL_SCHOOL_YEAR: ${INITIAL_SCHOOL_YEAR:?INITIAL_SCHOOL_YEAR em falta}
      SCHOOL_NAME: ${SCHOOL_NAME:-Escola por configurar}
      SPRINGDOC_API_DOCS_ENABLED: 'false'
      SPRINGDOC_SWAGGER_UI_ENABLED: 'false'
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    security_opt: [no-new-privileges:true]
    logging: *logs
  frontend:
    image: sige-frontend:${RELEASE_TAG:-initial}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80'
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    logging: *logs
volumes:
  mysql_data:
