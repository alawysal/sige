version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: escola_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-escola_db}
      MYSQL_USER: ${DB_USERNAME:-escola}
      MYSQL_PASSWORD: ${DB_PASSWORD:-escola123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: escola_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-escola_db}
      DB_USERNAME: ${DB_USERNAME:-escola}
      DB_PASSWORD: ${DB_PASSWORD:-escola123}
      JWT_SECRET: ${JWT_SECRET:-QjY4c3Q4M1pOc2VnVWo2U0RvS1JmYk9nT0RqcGJZb1Q2U3V2N0M0Q==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEMO_SEED: ${DEMO_SEED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escola_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
