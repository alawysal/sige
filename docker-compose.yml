services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-escola_db}
      MYSQL_USER: ${DB_USERNAME:-escola}
      MYSQL_PASSWORD: ${DB_PASSWORD:-escola123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-escola_db}
      DB_USERNAME: ${DB_USERNAME:-escola}
      DB_PASSWORD: ${DB_PASSWORD:-escola123}
      JWT_SECRET: ${JWT_SECRET:-QjY4c3Q4M1pOc2VnVWo2U0RvS1JmYk9nT0RqcGJZb1Q2U3V2N0M0Q==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      DEMO_SEED: ${DEMO_SEED:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
